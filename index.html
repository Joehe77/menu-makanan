<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nendra Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Nendra Shop</h1>
    <p>Pesan langsung via WhatsApp</p>
  </header>

  <h2 class="kategori">🍟 Makanan</h2>
  <main class="menu-container" id="menuMakanan"></main>

  <div id="cartBox" class="cart-box">
    <h3>🛒 Keranjang</h3>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">Rp 0</span>
    </div>
    <button class="btn-wa-cart" onclick="kirimPesanan()">
      Pesan via WhatsApp
    </button>
  </div>

  <a href="https://wa.me/6281233964272?text=Halo%20Nendra%20Shop%2C%20saya%20mau%20pesan"
     class="wa-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA" />
  </a>

  <script src="script.js"></script>
</body>
</html>
